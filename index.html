
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101a3d">
<title>Jeopardy! — Two-Team Trivia</title>
<style>
:root {
  --navy: #101a3d;
  --gold: #ffd45c;
  --ink: #111a36;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: radial-gradient(ellipse at top,#263d82 0,#101a3d 58%,#090f25 100%);
  color: white;
  font-family: system-ui,-apple-system,Segoe UI,Arial,sans-serif;
  min-height: 100vh;
}
header { text-align:center; padding:22px 14px 12px; }
h1 {
  margin:0; color:var(--gold); font-family:Georgia,serif;
  font-size:clamp(2rem,6vw,3.4rem); letter-spacing:.07em;
  text-shadow:0 3px 0 #8c5a13;
}
header p { margin:5px 0 0; color:#dce5ff; }
main { max-width:1200px; margin:auto; padding:12px 16px 40px; }
.scores {
  display:grid; grid-template-columns:1fr 1fr;
  gap:12px; margin:12px 0 18px;
}
.team {
  background:#fff; color:var(--ink); border:3px solid transparent;
  border-radius:14px; padding:12px 14px;
  display:grid; grid-template-columns:1fr auto;
  align-items:center; gap:5px; box-shadow:0 5px 0 #070d20;
}
.team.active {
  border-color:var(--gold);
  box-shadow:0 0 0 3px #ffd45c55,0 5px 0 #070d20;
}
.team label { font-weight:800; font-size:1.05rem; }
.team input {
  border:0; border-bottom:2px solid #c8cee0;
  font:inherit; font-weight:700; width:100%;
  min-width:0; padding:3px; color:var(--ink);
}
.score {
  font-size:clamp(1.5rem,4vw,2.1rem);
  font-weight:900; color:#173b9b; grid-row:span 2;
}
.turn {
  text-align:center; color:#ffdf7d;
  font-weight:700; margin:0 0 12px;
}
.board {
  display:grid; grid-template-columns:repeat(6,minmax(0,1fr));
  gap:7px;
}
.category {
  background:#0c1740; border:1px solid #637bc5;
  border-radius:8px; min-height:82px;
  display:flex; align-items:center; justify-content:center;
  text-align:center; padding:8px 4px; font-weight:900;
  font-size:clamp(.65rem,1.5vw,1rem);
  line-height:1.15; text-transform:uppercase;
  color:#fff; overflow-wrap:anywhere;
}
.clue {
  min-height:76px; border:0; border-radius:8px;
  background:linear-gradient(145deg,#2858c5,#16358c);
  color:var(--gold); font-size:clamp(1rem,2.5vw,1.55rem);
  font-weight:900; cursor:pointer;
  box-shadow:0 4px 0 #09163e;
  transition:transform .12s,filter .12s;
}
.clue:hover:not(:disabled) {
  filter:brightness(1.2); transform:translateY(-2px);
}
.clue:disabled {
  background:#18234b; color:#68749c;
  cursor:default; box-shadow:none; text-decoration:line-through;
}
.controls {
  display:flex; gap:9px; justify-content:center;
  flex-wrap:wrap; margin:18px 0;
}
.btn {
  border:0; border-radius:10px; padding:11px 16px;
  font-weight:800; font-size:.95rem; cursor:pointer;
}
.btn.gold { background:var(--gold); color:#241b08; }
.btn.light { background:#e8edff; color:#14214e; }
.btn:disabled { opacity:.4; cursor:not-allowed; }
.modal {
  position:fixed; inset:0; background:#050a1bdc;
  display:none; align-items:center; justify-content:center;
  padding:16px; z-index:5;
}
.modal.show { display:flex; }
.dialog {
  width:min(760px,100%); max-height:90vh; overflow:auto;
  background:linear-gradient(155deg,#1e3d98,#101a3d);
  border:2px solid var(--gold); border-radius:20px;
  padding:clamp(20px,5vw,38px); text-align:center;
  box-shadow:0 20px 80px #0009;
}
.dialog .value {
  color:var(--gold); font-weight:900; letter-spacing:.1em;
}
.dialog h2 {
  font-size:clamp(1.3rem,3.8vw,2rem);
  line-height:1.4; margin:16px 0 22px;
}
.answer {
  display:none; background:#0a1435; border-radius:12px;
  padding:16px; margin:15px 0; color:#dce7ff;
  font-size:1.05rem; line-height:1.5;
}
.answer.show { display:block; }
.modal-actions {
  display:flex; justify-content:center;
  gap:9px; flex-wrap:wrap; margin-top:18px;
}
.small { color:#c6d2f7; font-size:.88rem; margin-top:16px; }
.rules {
  color:#cbd7ff; text-align:center;
  font-size:.9rem; margin-top:12px;
}
@media(max-width:650px) {
  main { padding:8px 8px 28px; }
  .board { gap:4px; }
  .category {
    min-height:76px; padding:5px 2px;
    font-size:clamp(.56rem,2vw,.78rem);
  }
  .clue {
    min-height:62px; border-radius:5px;
    font-size:clamp(.75rem,2.5vw,1rem);
  }
  .scores { gap:7px; }
  .team { padding:9px; }
  .team label { font-size:.9rem; }
  .score { font-size:1.4rem; }
}
@media(max-width:380px) {
  .category { font-size:.52rem; }
  .clue { font-size:.75rem; }
}
</style>
</head>
<body>

<header>
  <h1>JEOPARDY!</h1>
  <p>Six categories · Two teams · Expert difficulty</p>
</header>

<main>
<section class="scores" aria-label="Team scores">
  <div class="team active" id="teamCard0">
    <div>
      <label for="team0">TEAM 1</label>
      <input id="team0" value="Team 1" maxlength="18">
    </div>
    <div class="score" id="score0">$0</div>
  </div>

  <div class="team" id="teamCard1">
    <div>
      <label for="team1">TEAM 2</label>
      <input id="team1" value="Team 2" maxlength="18">
    </div>
    <div class="score" id="score1">$0</div>
  </div>
</section>

<p class="turn" id="turn">Team 1 chooses a clue first</p>
<section class="board" id="board"></section>

<div class="controls">
  <button class="btn light" id="switchBtn">Switch active team</button>
  <button class="btn light" id="resetBtn">Reset game</button>
</div>

<p class="rules">
  Choose a clue, reveal the answer, then award or deduct points.
  Questions get harder as the dollar values rise.
</p>
</main>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="dialog">
    <div class="value" id="clueValue"></div>
    <h2 id="question"></h2>

    <button class="btn gold" id="revealBtn">Reveal answer</button>
    <div class="answer" id="answer"></div>

    <div class="modal-actions">
      <button class="btn gold" id="correctBtn" disabled>
        ✓ Correct (+ points)
      </button>
      <button class="btn light" id="wrongBtn" disabled>
        ✕ Incorrect (− points)
      </button>
      <button class="btn light" id="closeBtn">Close clue</button>
    </div>

    <div class="small">
      The active team receives the score adjustment.
      Close the clue, then switch teams if needed.
    </div>
  </div>
</div>

<script>
const categories = [
{
name:"Bollywood",
clues:[
["In Guru Dutt’s 1959 film, this poet-protagonist’s name is also the title of the movie.","Vijay — Pyaasa."],
["Who composed the music for the 1960 film Mughal-e-Azam?","Naushad."],
["Which 1975 film was initially released with a different ending in which Jai survives?","Sholay. The original ending was altered before release."],
["In Satyajit Ray’s Apu Trilogy, what is the name of the first film?","Pather Panchali (1955)."],
["Which filmmaker directed the 1957 Hindi film Mother India, starring Nargis as Radha?","Mehboob Khan."],
["In Lagaan, what is the name of the British captain whose team plays the villagers?","Captain Andrew Russell."]
]
},
{
name:"Indian Mythology",
clues:[
["In the Mahabharata, what is the name of the kingdom ruled by the Kauravas from their capital at Hastinapura?","The Kuru Kingdom."],
["Which sage is traditionally credited with composing the Yoga Sutras and is also associated with grammatical scholarship?","Patanjali."],
["In the Ramayana, who is the mother of Indrajit (Meghanada), Ravana’s son?","Mandodari."],
["The Jagannath Rath Yatra is most famously associated with which city in Odisha?","Puri."],
["In the Bhagavad Gita, on which battlefield does Krishna deliver his teaching to Arjuna?","Kurukshetra."],
["In the Devi Mahatmya, which buffalo-demon does the goddess Durga defeat?","Mahishasura."]
]
},
{
name:"Thanksgiving",
clues:[
["The 1621 harvest gathering commonly called the First Thanksgiving took place in which present-day U.S. state?","Massachusetts, at Plymouth."],
["Which Indigenous people are documented as having participated in the 1621 Plymouth harvest gathering?","The Wampanoag people."],
["Which president signed the 1941 federal law fixing Thanksgiving on the fourth Thursday of November?","Franklin D. Roosevelt."],
["What controversial change did Franklin D. Roosevelt make to Thanksgiving in 1939?","He moved it one week earlier to lengthen the Christmas shopping season. It became known as Franksgiving."],
["Which U.S. woman campaigned for decades to establish a national Thanksgiving holiday?","Sarah Josepha Hale."],
["According to Edward Winslow's account, approximately how long did the 1621 Plymouth gathering last?","Three days."]
]
},
{
name:"Indian History",
clues:[
["Which 1793 colonial land-revenue arrangement in Bengal made zamindars responsible for fixed payments to the East India Company?","The Permanent Settlement, introduced by Lord Cornwallis."],
["The Allahabad Pillar inscription praising Samudragupta was composed by which court poet?","Harisena."],
["Which 1905 British viceroy partitioned Bengal, helping ignite the Swadeshi movement?","Lord Curzon."],
["At which 1929 Congress session was Purna Swaraj adopted as the goal of Indian independence?","The Lahore Session, presided over by Jawaharlal Nehru."],
["Which 18th-century Mysore ruler used rocket artillery against the British and died at the Siege of Seringapatam in 1799?","Tipu Sultan."],
["Who was the first Indian woman to become president of the Indian National Congress?","Annie Besant, in 1917."]
]
},
{
name:"World History",
clues:[
["The 1648 Peace of Westphalia is commonly associated with ending which major European conflict?","The Thirty Years’ War."],
["Which 14th-century West African ruler’s pilgrimage to Mecca became famous for the enormous quantities of gold he distributed?","Mansa Musa of the Mali Empire."],
["What 1884–85 conference formalized European rules for claiming territory in Africa, without African representation?","The Berlin Conference."],
["Which Byzantine emperor commissioned the compilation of Roman law known as the Corpus Juris Civilis?","Justinian I."],
["The Meiji Restoration of 1868 ended the rule of which Japanese shogunate?","The Tokugawa shogunate."],
["Which 1815 diplomatic settlement reshaped Europe after Napoleon’s defeat at Waterloo?","The Congress of Vienna."]
]
},
{
name:"Indian Sweets",
clues:[
["Which Gujarati sweet is made from gram flour batter fermented with yogurt, steamed, and tempered with mustard seeds?","Dhokla (khaman is a closely related gram-flour preparation)."],
["Which Rajasthani disc-shaped sweet has a honeycomb-like texture, is made by pouring batter into hot ghee, and is often topped with rabri?","Ghevar."],
["Which chhena-based Odisha sweet is traditionally baked or roasted until browned, rather than boiled in syrup?","Chhena poda."],
["What is the key thickening dairy ingredient in the North Indian sweet peda, besides sugar and flavorings?","Khoya (mawa)."],
["Which Maharashtra sweet is made from steamed rice-flour dumplings filled with coconut and jaggery, commonly offered to Ganesha?","Modak."],
["In the Bengali sweet sandesh, what fresh cheese is the principal base?","Chhena (fresh curd cheese)."]
]
}
];

const values = [200,400,600,800,1000,1200];

let scores = [0,0];
let active = 0;
let current = null;
let used = new Set();

const board = document.getElementById('board');
const modal = document.getElementById('modal');

function teamName(i) {
  return document.getElementById('team'+i).value.trim() || `Team ${i+1}`;
}

function update() {
  for(let i=0;i<2;i++) {
    document.getElementById('score'+i).textContent =
      (scores[i]<0?'−':'$') + Math.abs(scores[i]).toLocaleString();

    document.getElementById('teamCard'+i)
      .classList.toggle('active',active===i);
  }
  document.getElementById('turn').textContent =
    `${teamName(active)} is up — choose a clue`;
}

function build() {
  board.innerHTML = '';

  categories.forEach(cat => {
    const h = document.createElement('div');
    h.className = 'category';
    h.textContent = cat.name;
    board.appendChild(h);
  });

  values.forEach((v,r) => {
    categories.forEach((cat,c) => {
      const key = `${c}-${r}`;
      const b = document.createElement('button');
      b.className = 'clue';
      b.textContent = `$${v.toLocaleString()}`;
      b.disabled = used.has(key);
      b.setAttribute('aria-label',`${cat.name}, ${v} points`);
      b.onclick = () => openClue(c,r,key);
      board.appendChild(b);
    });
  });
}

function openClue(c,r,key) {
  current = {c,r,key,value:values[r]};

  document.getElementById('clueValue').textContent =
    `${categories[c].name} · $${values[r].toLocaleString()}`;

  document.getElementById('question').textContent =
    categories[c].clues[r][0];

  document.getElementById('answer').textContent =
    categories[c].clues[r][1];

  document.getElementById('answer').classList.remove('show');
  document.getElementById('revealBtn').style.display = 'inline-block';
  document.getElementById('correctBtn').disabled = true;
  document.getElementById('wrongBtn').disabled = true;

  modal.classList.add('show');
}

function closeClue() {
  modal.classList.remove('show');

  if(current) {
    used.add(current.key);
    build();
    current = null;
  }
}

document.getElementById('revealBtn').onclick = () => {
  document.getElementById('answer').classList.add('show');
  document.getElementById('revealBtn').style.display = 'none';
  document.getElementById('correctBtn').disabled = false;
  document.getElementById('wrongBtn').disabled = false;
};

document.getElementById('correctBtn').onclick = () => {
  scores[active] += current.value;
  closeClue();
  update();
};

document.getElementById('wrongBtn').onclick = () => {
  scores[active] -= current.value;
  closeClue();
  update();
};

document.getElementById('closeBtn').onclick = closeClue;

document.getElementById('switchBtn').onclick = () => {
  active = 1-active;
  update();
};

document.getElementById('resetBtn').onclick = () => {
  if(confirm('Reset all scores and bring back every clue?')) {
    scores = [0,0];
    active = 0;
    used.clear();
    build();
    update();
  }
};

for(let i=0;i<2;i++) {
  document.getElementById('team'+i).addEventListener('input',update);
}

build();
update();
</script>
</body>
</html>
